name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# npm OIDC trusted publishing only.
#
# No long-lived `NPM_TOKEN` secret is used. Instead, npmjs verifies that
# the publish request comes from this exact repo + this exact workflow
# file. The linking happens once on npmjs.com (the user's npm package's
# "Trusted Publisher" settings) — see README for the walkthrough.
permissions:
  contents: read
  id-token: write   # required for npm OIDC trusted publishing
  packages: write

jobs:
  publish:
    name: Typecheck + Build + Test + Publish
    runs-on: ubuntu-latest
    # Run only on version tags, or when manually dispatched. Branch pushes
    # don't publish; they don't build either (this workflow is release-only).
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Configure the registry; npm CLI performs the OIDC exchange,
          # not setup-node. No long-lived NODE_AUTH_TOKEN is needed.
          registry-url: "https://registry.npmjs.org/"

      - name: Install npm with trusted publishing support
        # Trusted publishing requires npm >=11.5.1. Node 22 bundles npm 10,
        # which can sign provenance but cannot authenticate via OIDC.
        run: |
          npm install --global npm@11
          node --version
          npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Publish to npm (OIDC trusted publishing)
        # npm 11 exchanges the GitHub Actions OIDC token for npm credentials.
        # Authentication and provenance signing are separate operations.
        #
        # `--access public` is intentionally omitted: this workflow is
        # re-used for both private (early) and public (release) publishes.
        # The effective access level comes from `publishConfig.access` in
        # package.json — `restricted` for pre-release test publishes,
        # `public` for the final 1.0+ tag.
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --provenance
